<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>千葉</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d2a33; --accent: #2f6f8f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14191d; --fg: #eef2f4; --accent: #7cc0dc; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #14191d; --fg: #eef2f4; --accent: #7cc0dc; color-scheme: dark }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
  h1 { margin: 0; font-size: clamp(5rem, 28vw, 16rem); font-weight: 800; letter-spacing: .08em; }
  h1::after { content: ""; display: block; height: .06em; margin-top: .1em; background: var(--accent); }
</style>
</head>
<body>
<h1>千葉</h1>
</body>
</html>
